version: "3.9"

services:
  tempo:
    image: grafana/tempo:${TEMPO_TAG:-2.10.7}
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    # Distroless image (no shell). Readiness: GET http://localhost:3200/ready
    # Pair with the grafana service (add a Tempo datasource -> http://host.docker.internal:3200).

volumes:
  tempo-data:
    name: tempo-data-${TEMPO_TAG:-2.10.7}
