version: "3.9"

services:
  sonarqube:
    image: sonarqube:${SONARQUBE_TAG:-26.7.0.124771-community}
    ports:
      - "9001:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  sonarqube-data:
    name: sonarqube-data-${SONARQUBE_TAG:-26.7.0.124771-community}
  sonarqube-logs:
    name: sonarqube-logs-${SONARQUBE_TAG:-26.7.0.124771-community}
  sonarqube-extensions:
    name: sonarqube-extensions-${SONARQUBE_TAG:-26.7.0.124771-community}

