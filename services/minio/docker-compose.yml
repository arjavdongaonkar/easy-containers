version: "3.9"

services:
  minio:
    image: quay.io/minio/minio:${MINIO_TAG:-RELEASE.2025-09-07T16-13-09Z}
    env_file:
      - .env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio-data:
    name: minio-data-${MINIO_TAG:-RELEASE.2025-09-07T16-13-09Z}

