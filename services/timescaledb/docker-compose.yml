version: "3.9"

services:
  timescaledb:
    image: timescale/timescaledb:${TIMESCALEDB_TAG:-2.28.3-pg17}
    env_file:
      - .env
    ports:
      - "${TIMESCALEDB_PORT:-5433}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb-data:
    name: timescaledb-data-${TIMESCALEDB_TAG:-2.28.3-pg17}
