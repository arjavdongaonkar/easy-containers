version: "3.9"

services:
  pgadmin:
    image: dpage/pgadmin4:${PGADMIN_TAG:-9.16}
    env_file:
      - .env
    ports:
      - "${PGADMIN_PORT:-8089}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:80/misc/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgadmin-data:
    name: pgadmin-data-${PGADMIN_TAG:-9.16}
